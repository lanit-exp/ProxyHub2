<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodes Status Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        /* Заголовок */
        .main-title {
            margin-bottom: 30px;
            font-weight: 600;
            color: #60a5fa;
            font-size: 2rem;
            letter-spacing: -1px;
        }

        /* Общая информация */
        .header-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            background: var(--gradient);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .stat-item h3 {
            margin: 0;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-item p {
            margin: 8px 0 0 0;
            font-size: 1.4rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .stat-highlight { color: var(--accent-green) !important; }

        /* Сетка карточек нод */
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        .node-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 50px 20px 20px 20px; /* Увеличен верхний отступ для бейджа */
            border-left: 6px solid #475569;
            position: relative;
            transition: transform 0.2s;
            border-top: 1px solid #334155;
        }

        .node-card:hover { transform: translateY(-3px); }

        .node-card.free { border-left-color: var(--accent-green); }
        .node-card.busy { border-left-color: var(--accent-red); }

        /* Статус-бейдж сверху */
        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .free .status-badge { background: var(--accent-green); color: #064e3b; }
        .busy .status-badge { background: var(--accent-red); color: #450a0a; }

        /* ID Ноды вынесен в отдельный блок с отступом */
        .node-id-box {
            display: block;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #93c5fd;
            word-break: break-all;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .node-info-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .label { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
        .value { color: var(--text-main); }
        .session-id {
            color: #cbd5e1;
            font-size: 0.8rem;
            background: #0f172a;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
        }

        .tag-container {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            border: 1px solid #475569;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="main-title">Nodes <span style="color: #fff;">Status</span></h1>

    <!-- Общая информация -->
    <div class="header-stats">
        <div class="stat-item">
            <h3>Свободные ноды</h3>
            <p class="stat-highlight" th:text="${data.nodes.?[isFree == true].size()}">0</p>
        </div>
        <div class="stat-item">
            <h3>Всего нод</h3>
            <p th:text="${data.activeNode}">0</p>
        </div>
        <div class="stat-item">
            <h3>Ожидание (сек)</h3>
            <p th:text="${data.nodeAwaitTimeout}">0</p>
        </div>
        <div class="stat-item">
            <h3>Простой (сек)</h3>
            <p th:text="${data.nodeIdleTimeout}">0</p>
        </div>
        <div class="stat-item">
            <h3>Версия</h3>
            <p style="font-size: 1rem; color: var(--text-dim);" th:text="${data.version}">1.0.0</p>
        </div>
    </div>

    <!-- Список нод -->
    <div class="nodes-grid">
        <div th:each="node : ${data.nodes}"
             th:classappend="${node.isFree} ? 'free' : 'busy'"
             class="node-card">

            <div class="status-badge" th:text="${node.isFree} ? 'Свободна' : 'Занята'"></div>

            <div class="label" style="margin-bottom: 5px;">Node ID</div>
            <div class="node-id-box" th:text="${node.nodeId}">ID_PLACEHOLDER</div>

            <div class="node-info-row">
                <span class="label">Последняя активность:</span>
                <span class="value" th:text="${#strings.substring(node.lastActivity, 0, 19).replace('T', ' ')}"></span>
            </div>

            <div class="node-info-row">
                <span class="label">Активные сессии:</span>
                <div th:if="${#lists.isEmpty(node.driverSessionIds)}" class="value" style="color: var(--text-dim); italic">Нет активных сессий</div>
                <div th:each="sessionId : ${node.driverSessionIds}">
                    <span class="session-id" th:text="${sessionId}"></span>
                </div>
            </div>

            <div class="tag-container">
                <span class="tag" th:each="tag : ${node.tags}" th:text="${tag}"></span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
